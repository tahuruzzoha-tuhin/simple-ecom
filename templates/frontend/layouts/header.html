  {% load static %}

<!-- Header Section -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <img src="https://choicelegacy.com.bd/assets/images/product/brand/2024/Jan/17050597275450.webp" alt="StyleShop" width="180" height="40">
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">New Arrivals</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="womenDropdown" role="button" data-bs-toggle="dropdown">
                                Women
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Dresses</a></li>
                                <li><a class="dropdown-item" href="#">Tops</a></li>
                                <li><a class="dropdown-item" href="#">Bottoms</a></li>
                                <li><a class="dropdown-item" href="#">Accessories</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="menDropdown" role="button" data-bs-toggle="dropdown">
                                Men
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Shirts</a></li>
                                <li><a class="dropdown-item" href="#">Pants</a></li>
                                <li><a class="dropdown-item" href="#">Outerwear</a></li>
                                <li><a class="dropdown-item" href="#">Accessories</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link highlight-link" href="#">Sale</a>
                        </li>
                    </ul>
                    
                    <form class="d-flex me-3">
                        <input class="form-control me-2" type="search" placeholder="Search for products...">
                        <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i></button>
                    </form>
                    
                    <div class="d-flex">
                        {% if user.is_authenticated %}
                            <!-- If logged in: show Dashboard -->
                            <a href="{% url 'dashboardv2' %}" class="user-action text-dark">
                                <i class="bi bi-speedometer2 fs-4"></i>
                            </a>
                        {% else %}
                            <!-- If not logged in: show Login -->
                            <a href="{% url 'login_view' %}" class="user-action text-dark">
                                <i class="bi bi-person fs-4"></i>
                            </a>
                        {% endif %}

                        <!-- Wishlist -->
                        <a href="#" class="user-action text-dark ms-3">
                            <i class="bi bi-heart fs-4"></i>
                            <span class="badge-count">3</span>
                        </a>

                        <!-- Cart -->
                        <a href="#" class="user-action text-dark ms-3">
                            <i class="bi bi-cart3 fs-4"></i>
                            <span class="badge-count">2</span>
                        </a>
                    </div>

                </div>
            </div>
        </nav>
    </header>
