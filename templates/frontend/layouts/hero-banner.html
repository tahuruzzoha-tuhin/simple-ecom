    

  {% load static %}
    <!-- Hero Banner Section -->
    <section class="mb-5 pt-5">
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80" class="d-block w-100" alt="Summer Collection">
                    <div class="carousel-caption d-none d-md-block">
                        <h2 class="display-4 fw-bold">Summer Collection 2023</h2>
                        <p class="fs-5">Discover the latest trends for the sunny season</p>
                        <a href="#" class="btn btn-primary btn-lg mt-3">Shop Now</a>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1617137968427-85924c800a22?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80" class="d-block w-100" alt="Men's Essentials">
                    <div class="carousel-caption d-none d-md-block text-start">
                        <h2 class="display-4 fw-bold">Men's Essentials</h2>
                        <p class="fs-5">Upgrade your wardrobe with our premium selection</p>
                        <a href="#" class="btn btn-primary btn-lg mt-3">Explore Men's</a>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80" class="d-block w-100" alt="Sale">
                    <div class="carousel-caption d-none d-md-block text-end">
                        <h2 class="display-4 fw-bold">Sale: Up to 50% Off</h2>
                        <p class="fs-5">Limited time offer on selected items</p>
                        <a href="#" class="btn btn-primary btn-lg mt-3">View Sale</a>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </section>
