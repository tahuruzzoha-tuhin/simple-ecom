    
  {% load static %}
    <!-- Newsletter Section -->
    <section class="newsletter-section py-5 mb-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <h2>Stay Updated</h2>
                    <p class="text-muted mb-4">Subscribe to our newsletter for exclusive offers and updates</p>
                    
                    <form class="row g-3 justify-content-center">
                        <div class="col-md-8">
                            <input type="email" class="form-control form-control-lg" placeholder="Your email address">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary btn-lg w-100">Subscribe</button>
                        </div>
                    </form>
                    
                    <p class="small text-muted mt-3">We respect your privacy and will never share your information.</p>
                </div>
            </div>
        </div>
    </section>
